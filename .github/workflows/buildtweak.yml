name: Build RyukGram tweak

on:
  push:
    branches:
      - experimental
      - experiment2
  pull_request:
    branches:
      - experimental
      - experiment2
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    env:
      SDK_NAME: iPhoneOS26.2.sdk
      OUTPUT_BASENAME: Ryukgram-1.3.3.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: main

      - run: brew install ldid dpkg make zip pipx
      - run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
      - run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - uses: actions/cache@v4
        id: SDK
        env:
          cache-name: iPhoneOS26.2.sdk
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone "$SDK_NAME"
          git checkout
          mkdir -p "$THEOS/sdks"
          mv *.sdk "$THEOS/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Validate SDK 26.2 and prepare
        run: |
          set -euo pipefail
          cd main
          chmod +x scripts/*.sh build.sh modules/build-dev.sh || true
          scripts/validate-sdk26-liquidglass.sh
          test -d "$THEOS/sdks/$SDK_NAME"
          grep -q 'TARGET := iphone:clang:26.2:16.3' Makefile
          grep -q '^ARCHS = arm64$' Makefile
          ./scripts/setup-ffmpegkit.sh
          echo "Skipping deb build in CI; building IPA only."
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Download base Instagram IPA (via GitHub API)
        run: |
          set -euo pipefail
          cd main/packages

          owner=raulferns
          repo=Ryukgram-Fork
          tag=v1.2.3

          api="https://api.github.com/repos/${owner}/${repo}/releases/tags/${tag}"
          echo "Fetching release ${tag} from ${owner}/${repo}"

            release_json=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" "$api") || true

            asset_url=$(echo "$release_json" | python3 -c 'import sys,json; d=json.load(sys.stdin or "{}" ); print(next((a.get("browser_download_url","") for a in d.get("assets",[]) if a.get("name","" ).endswith(".ipa")), ""))')

          if [ -z "$asset_url" ]; then
            echo "No IPA asset found for release ${tag}; skipping IPA download/build"
            exit 0
          fi

          echo "Downloading IPA from: $asset_url"
          curl -L -H "Authorization: token ${GITHUB_TOKEN}" -o "com.burbn.instagram.ipa" "$asset_url"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build noplugins IPA
        run: |
          set -xeuo pipefail
          cd main
          chmod +x scripts/*.sh build.sh modules/build-dev.sh || true
          
          # Find any downloaded base IPA in the packages folder and rename it to com.burbn.instagram.ipa if it isn't already
          FOUND_IPA=$(find packages -maxdepth 1 -type f -name "*.ipa" ! -name "RyukGram*" ! -name "Ryukgram*" | head -n 1)
          if [ -n "$FOUND_IPA" ] && [ "$FOUND_IPA" != "packages/com.burbn.instagram.ipa" ]; then
            mv "$FOUND_IPA" "packages/com.burbn.instagram.ipa"
          fi
          
          # Skip IPA build if decrypted Instagram IPA is not available
          if [ ! -f "packages/com.burbn.instagram.ipa" ]; then
            echo "⚠️  Skipping IPA build: decrypted Instagram IPA not found in packages/"
            exit 0
          fi
          
          ./scripts/setup-ffmpegkit.sh
          ./build.sh noplugins
          mkdir -p release
          IPA="$( { ls -t packages/*noplugins*.ipa packages/*sideloaded*.ipa packages/*.ipa 2>/dev/null || true; } | head -n 1)"
          test -n "$IPA"
          cp "$IPA" "release/${OUTPUT_BASENAME}.ipa"
          ls -la release
        env:
          THEOS: ${{ github.workspace }}/theos
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: Ryukgram-1.3.3.${{ github.run_number }}-ipa
          path: main/release/Ryukgram-1.3.3.${{ github.run_number }}.ipa
          if-no-files-found: ignore