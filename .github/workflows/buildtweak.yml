name: Build RyukGramPrivExp (rootless, SDK 26.2)

on:
    push:
        branches:
            - 'experiments'
            - 'experimental'
            - 'experimental2'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build RyukGramPrivExp (rootless)
        runs-on: macos-latest
        permissions:
            contents: write

        env:
            SDK_NAME: iPhoneOS26.2.sdk
            OUTPUT_BASENAME: RyukGramPrivExp.3.2.${{ github.run_number }}

        steps:
            - name: Checkout Main
              uses: actions/checkout@v4
              with:
                path: main

            - name: Install Dependencies
              run: brew install ldid dpkg make

            - name: Set PATH environment variable
              run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

            - name: Setup Theos
              uses: actions/checkout@v4
              with:
                repository: theos/theos
                ref: master
                path: ${{ github.workspace }}/theos
                submodules: recursive

            - name: SDK Caching
              id: SDK
              uses: actions/cache@v4
              env:
                cache-name: iPhoneOS26.2.sdk
              with:
                path: ${{ github.workspace }}/theos/sdks/
                key: ${{ env.cache-name }}
                restore-keys: ${{ env.cache-name }}

            - name: Download iOS SDK
              if: steps.SDK.outputs.cache-hit != 'true'
              run: |
                git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
                cd iOS-SDKs
                git sparse-checkout set --no-cone "$SDK_NAME"
                git checkout
                mkdir -p "$THEOS/sdks"
                mv *.sdk "$THEOS/sdks"
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Validate SDK 26.2 LiquidGlass headers
              run: |
                cd main
                chmod +x scripts/*.sh build.sh || true
                scripts/validate-sdk26-liquidglass.sh
                test -d "$THEOS/sdks/$SDK_NAME"
                grep -q 'TARGET := iphone:clang:26.2:16.3' Makefile
                grep -q '^ARCHS = arm64$' Makefile
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Setup FFmpegKit
              run: cd main && ./scripts/setup-ffmpegkit.sh

            - name: Build rootless
              run: |
                cd main
                ./build.sh rootless
                mkdir -p release
                DEB="$(ls -t packages/*-rootless.deb packages/*.deb 2>/dev/null | head -n1)"
                test -n "$DEB"
                cp "$DEB" "release/${OUTPUT_BASENAME}.deb"
                ls -la release
              env:
                THEOS: ${{ github.workspace }}/theos
                THEOS_PLATFORM_DEB_COMPRESSION_TYPE: lzma
                THEOS_PLATFORM_DEB_COMPRESSION_LEVEL: 9

            - name: Upload rootless artifact
              uses: actions/upload-artifact@v4
              with:
                name: RyukGramPrivExp.3.2.${{ github.run_number }}
                path: main/release/RyukGramPrivExp.3.2.${{ github.run_number }}.deb
                if-no-files-found: error