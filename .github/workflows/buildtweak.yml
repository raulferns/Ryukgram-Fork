name: Build RyukGram tweak

on:
  push:
    branches: [experimental]
  pull_request:
    branches: [experimental]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    env:
      SDK_NAME: iPhoneOS26.2.sdk
      OUTPUT_BASENAME: Ryukgram-1.3.3.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: main

      - run: brew install ldid dpkg make zip pipx
      - run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
      - run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - uses: actions/cache@v4
        id: SDK
        env:
          cache-name: iPhoneOS26.2.sdk
        with:
          path: ${{ github.workspace }}/theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
          cd iOS-SDKs
          git sparse-checkout set --no-cone "$SDK_NAME"
          git checkout
          mkdir -p "$THEOS/sdks"
          mv *.sdk "$THEOS/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Validate SDK 26.2 and build rootless arm64
        run: |
          set -euo pipefail
          cd main
          chmod +x scripts/*.sh build.sh modules/build-dev.sh || true
          scripts/validate-sdk26-liquidglass.sh
          test -d "$THEOS/sdks/$SDK_NAME"
          grep -q 'TARGET := iphone:clang:26.2:16.3' Makefile
          grep -q '^ARCHS = arm64$' Makefile
          ./scripts/setup-ffmpegkit.sh
          ./build.sh rootless
          mkdir -p release
          DEB="$(ls -t packages/*rootless*.deb packages/*.deb 2>/dev/null | head -n 1)"
          test -n "$DEB"
          cp "$DEB" "release/${OUTPUT_BASENAME}.deb"
          ls -la release
        env:
          THEOS: ${{ github.workspace }}/theos
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE: lzma
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL: 9

      - name: Download base Instagram IPA
        run: |
          set -euo pipefail
          cd main/packages
          gh release download instagram-base --pattern "*.ipa" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build noplugins IPA
        run: |
          set -euo pipefail
          cd main
          chmod +x scripts/*.sh build.sh modules/build-dev.sh || true
          
          # Skip IPA build if decrypted Instagram IPA is not available
          if [ ! -f "packages/com.burbn.instagram.ipa" ]; then
            echo "⚠️  Skipping IPA build: decrypted Instagram IPA not found in packages/"
            echo "   To build IPA locally, place com.burbn.instagram.ipa in the packages/ folder"
            exit 0
          fi
          
          ./scripts/setup-ffmpegkit.sh
          ./build.sh noplugins
          mkdir -p release
          IPA="$(ls -t packages/*noplugins*.ipa packages/*sideloaded*.ipa packages/*.ipa 2>/dev/null | head -n 1)"
          test -n "$IPA"
          cp "$IPA" "release/${OUTPUT_BASENAME}.ipa"
          ls -la release
        env:
          THEOS: ${{ github.workspace }}/theos
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: Ryukgram-1.3.3.${{ github.run_number }}-deb
          path: main/release/Ryukgram-1.3.3.${{ github.run_number }}.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Ryukgram-1.3.3.${{ github.run_number }}-ipa
          path: main/release/Ryukgram-1.3.3.${{ github.run_number }}.ipa
          if-no-files-found: ignore
